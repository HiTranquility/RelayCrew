name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run releases:verify
      - run: npm run package
      - name: Match version and prepare assets
        run: npm run release:stage -- "$GITHUB_REF_NAME"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*.vsix release-assets/SHA256SUMS
          --verify-tag --prerelease --title "RelayCrew $GITHUB_REF_NAME"
          --notes-file release-assets/NOTES.md

name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to verify and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate immutable tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run releases:verify
      - run: npm run package
      - name: Match version and prepare assets
        run: npm run release:stage -- "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == v0.* ]]; then flags=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/*.vsix release-assets/SHA256SUMS \
            --verify-tag "${flags[@]}" --title "RelayCrew $RELEASE_TAG" \
            --notes-file release-assets/NOTES.md
